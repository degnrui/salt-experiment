name: Workshop server handoff
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-and-authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect existing host and authorize temporary deployment key
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s %s\n' "$ECS_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAYlbvcaTLgbjnxiydc/biblsRpn+sIefVseCNzQJ4Le' > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "$ECS_USER@$ECS_HOST" 'bash -se' <<'REMOTE'
          echo '=== Host inventory ==='
          printf 'uid='; id -u
          printf 'os='; . /etc/os-release; echo "$PRETTY_NAME"
          free -m
          df -h /
          printf 'node='; node --version || true
          printf 'python='; python3 --version || true
          echo '=== Existing services ==='
          pm2 list --no-color || true
          echo '=== Nginx site domains and upstreams ==='
          (nginx -T 2>/dev/null || sudo -n nginx -T 2>/dev/null || true) | awk '/server_name |proxy_pass |ssl_certificate / {print}'
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sed -i '/physmentor-research-live-temporary/d' "$HOME/.ssh/authorized_keys"
          printf '%s\n' 'no-agent-forwarding,no-port-forwarding,no-X11-forwarding,no-pty ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGE9AJMugMLtmWstBGfWkKAB/NMm+pByMWCg8riYMPVj physmentor-research-live-temporary' >> "$HOME/.ssh/authorized_keys"
          if sudo -n true 2>/dev/null; then
          sudo -n mkdir -p /root/.ssh
          sudo -n chmod 700 /root/.ssh
          sudo -n sed -i "/physmentor-research-live-temporary/d" /root/.ssh/authorized_keys
          printf '%s\n' 'no-agent-forwarding,no-port-forwarding,no-X11-forwarding,no-pty ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGE9AJMugMLtmWstBGfWkKAB/NMm+pByMWCg8riYMPVj physmentor-research-live-temporary' | sudo -n tee -a /root/.ssh/authorized_keys >/dev/null
          sudo -n chmod 600 /root/.ssh/authorized_keys
          echo 'Temporary owner deployment channel authorized.'
          else
          echo 'No administrative sudo access; original deployment account can manage the existing app only.'
          fi
          echo 'Original service unchanged.'
          REMOTE
          rm -f ~/.ssh/deploy_key
